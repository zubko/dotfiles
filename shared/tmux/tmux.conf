# Click to select panes and windows, drag to resize, scroll with the wheel.
set -g mouse on

# Lines of scrollback kept per pane. Default is 2000.
set -g history-limit 10000

# Vim keys in copy mode (prefix [): h/j/k/l to move, v to select, C-v for a block, y to copy.
# The vi table has no v to select and no y to copy by default.
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel

# Number windows and panes from 1, not 0. The 1 key is next to the prefix on the keyboard.
set -g base-index 1
setw -g pane-base-index 1

# Close the gaps in window numbers after a window is closed.
set -g renumber-windows on

# Wait 10 ms after Esc, not 500 ms. Makes Esc feel instant in vim.
set -sg escape-time 10

# Tell programs inside tmux that they have 256 colors.
set -g default-terminal "tmux-256color"

# Copy in copy mode goes to the system clipboard too.
set -g set-clipboard on

# Tell programs inside tmux when they gain or lose focus. Lets vim reload files changed on disk.
set -g focus-events on

# Room for long session names in the status bar. Default is 10.
set -g status-left-length 30

# A calm gray status bar instead of the default bright green.
set -g status-style bg=colour247,fg=black

# The default right side without the time and date.
set -g status-right '#{?window_bigger,[#{window_offset_x}#,#{window_offset_y}] ,}"#{=21:pane_title}"'

# Show the current window as a bold tab with reversed colors in the status bar.
set -g window-status-current-style reverse,bold
set -g window-status-current-format ' #I:#W#{?window_flags,#{window_flags}, } '

# C-Space is a second prefix next to C-b. Press it twice to send C-Space to the app inside.
set -g prefix2 C-Space
bind C-Space send-prefix -2

# prefix r: reload this config.
bind r source-file ~/.tmux.conf \; display "Config reloaded"

# prefix c: ask for a name for the new window. Empty Enter keeps the automatic name, Esc cancels.
bind c command-prompt -p "Window name:" {
  if -F "#{==:%1,}" { new-window -c "#{pane_current_path}" } { new-window -c "#{pane_current_path}" -n "%1" }
}

# prefix X: kill the window right away, with no y/n question. prefix & still asks first.
bind X kill-window

# Double click a window name in the status bar to rename it.
bind -n DoubleClick1Status select-window -t = \; command-prompt -I "#W" { rename-window -- "%%" }

# Double click the session name in the status bar to rename it.
bind -n DoubleClick1StatusLeft command-prompt -I "#S" { rename-session -- "%%" }

# prefix s / prefix w: the list keys are 1-9, 0, then M-a to M-j.
set -g @tree-keys "#{?#{e|<:#{line},9},#{e|+:#{line},1},#{?#{==:#{line},9},0,#{?#{e|<:#{line},20},M-#{a:#{e|+:97,#{e|-:#{line},10}}},}}}"
bind s choose-tree -Zs -K "#{E:@tree-keys}"
bind w choose-tree -Zw -K "#{E:@tree-keys}"

# prefix | and prefix -: split the pane. Easier to remember than the default " and %.
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# prefix h/j/k/l: move between panes like in vim.
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Keep sessions across a reboot. resurrect saves with prefix C-s and restores with prefix C-r.
# continuum saves every 5 minutes (default 15) and restores when the tmux server starts.
# install.sh clones these into ~/.tmux/plugins. prefix I in tmux does the same.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '5'

# Every reload sets status-right again and drops continuum's save step. continuum adds it back only
# when it sees no other tmux process at that moment, so a reload can turn auto-save off.
# These hooks run continuum again when the save step is missing. [10] keeps other hooks on the same event.
%hidden CONTINUUM_RETRY="if -F '#{!:#{m:*continuum_save*,#{status-right}}}' { run -b 'test -x ~/.tmux/plugins/tmux-continuum/continuum.tmux && ~/.tmux/plugins/tmux-continuum/continuum.tmux >/dev/null 2>&1; true' }"
set-hook -g client-attached[10] "$CONTINUUM_RETRY"
set-hook -g client-session-changed[10] "$CONTINUUM_RETRY"
set-hook -g session-created[10] "$CONTINUUM_RETRY"

# Keep this last: continuum adds its save step to the status-right set above.
# The test skips TPM on a machine where it is not cloned yet, so tmux shows no error.
if "test -x ~/.tmux/plugins/tpm/tpm" "run ~/.tmux/plugins/tpm/tpm"
