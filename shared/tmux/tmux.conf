# Click to select panes and windows, drag to resize, scroll with the wheel.
set -g mouse on

# Lines of scrollback kept per pane. Default is 2000.
set -g history-limit 10000

# Vim keys in copy mode (prefix [): h/j/k/l to move, v to select, y to copy.
setw -g mode-keys vi

# Number windows and panes from 1, not 0. The 1 key is next to the prefix on the keyboard.
set -g base-index 1
setw -g pane-base-index 1

# Close the gaps in window numbers after a window is closed.
set -g renumber-windows on

# Wait 10 ms after Esc, not 500 ms. Makes Esc feel instant in vim.
set -sg escape-time 10

# Tell programs inside tmux that they have 256 colors.
set -g default-terminal "tmux-256color"

# Copy in copy mode goes to the system clipboard too.
set -g set-clipboard on

# prefix r: reload this config.
bind r source-file ~/.tmux.conf \; display "Config reloaded"

# prefix | and prefix -: split the pane. Easier to remember than the default " and %.
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

# prefix h/j/k/l: move between panes like in vim.
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
